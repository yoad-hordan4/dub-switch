name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        run: |
          pyinstaller \
            --noconfirm \
            --onedir \
            --windowed \
            --name "DubSwitch" \
            --add-data "layout.py:." \
            --add-data "input_source.py:." \
            --hidden-import "pynput.keyboard._darwin" \
            --hidden-import "pynput.mouse._darwin" \
            --hidden-import "rumps" \
            app.py

      - name: Sign app (ad-hoc)
        run: codesign --force --deep --sign - dist/DubSwitch.app

      - name: Create DMG
        run: |
          mkdir -p dist/dmg_tmp
          cp -R dist/DubSwitch.app dist/dmg_tmp/
          ln -s /Applications dist/dmg_tmp/Applications
          hdiutil create -volname "DubSwitch" \
            -srcfolder dist/dmg_tmp \
            -ov -format UDZO \
            DubSwitch-mac-${{ matrix.arch }}.dmg

      - name: Create ZIP
        run: |
          cp Install.command dist/Install.command
          chmod +x dist/Install.command
          cd dist && zip -r ../DubSwitch-mac-${{ matrix.arch }}.zip DubSwitch.app Install.command

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-${{ matrix.arch }}
          path: |
            DubSwitch-mac-${{ matrix.arch }}.dmg
            DubSwitch-mac-${{ matrix.arch }}.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --name "DubSwitch" `
            --add-data "layout.py;." `
            --add-data "input_source.py;." `
            --hidden-import "pynput.keyboard._win32" `
            --hidden-import "pynput.mouse._win32" `
            --hidden-import "pystray" `
            --hidden-import "PIL" `
            app.py

      - name: Create ZIP
        run: Compress-Archive -Path dist\DubSwitch -DestinationPath DubSwitch-windows.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: DubSwitch-windows.zip

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mac-build-x86_64/DubSwitch-mac-x86_64.dmg
            mac-build-x86_64/DubSwitch-mac-x86_64.zip
            mac-build-arm64/DubSwitch-mac-arm64.dmg
            mac-build-arm64/DubSwitch-mac-arm64.zip
            windows-build/DubSwitch-windows.zip
